<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="Tamilvanan Sambasivam, problem solver. Try, err and improve.">
<style>
  .a { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #111111; white-space: pre; animation: rise .5s ease-out both; }
  .n { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Noto Sans Tamil', 'Tamil Sangam MN', 'Nirmala UI', sans-serif; fill: #0A0A0A; letter-spacing: .5px; }
  .r { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Noto Sans Tamil', 'Tamil Sangam MN', 'Nirmala UI', sans-serif; fill: #0A0A0A; letter-spacing: 4.5px; }
  .m { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8A8A87; }
  .l { font: 600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Noto Sans Tamil', 'Tamil Sangam MN', 'Nirmala UI', sans-serif; fill: #8A8A87; letter-spacing: 3px; }
  .k { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8A8A87; }
  .v { font: 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Noto Sans Tamil', 'Tamil Sangam MN', 'Nirmala UI', sans-serif; fill: #1A1A1A; }
  .cur { fill: #0A0A0A; animation: blink 1.1s steps(1) infinite; }
  .card { animation: fade .7s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .a, .card, .cur { animation: none; } }
</style>
